  <text x="56" y="68" font-family="sans-serif" font-size="13" fill="#51483e">8 × 8 uncalibrated design units · no openings or connectors</text>
  <rect x="128" y="110" width="440" height="440" fill="#282521" stroke="#171512" stroke-width="13"/>
  <text x="348" y="101" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#3c352c">far / source-facing wall</text>
  <rect x="260" y="126" width="170" height="38" rx="3" fill="#302219" stroke="#a98a65" stroke-width="2"/>
  <text x="345" y="150" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#fff2db">dresser · frame_2731</text>
  <circle cx="286" cy="118" r="8" fill="#15130f" stroke="#f1d99b" stroke-width="2"/>
  <text x="277" y="185" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#f3e9d7">lamp</text>
  <rect x="337" y="114" width="27" height="22" fill="#111820" stroke="#c1d8de" stroke-width="2"/>
  <text x="350" y="185" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#f3e9d7">screen</text>
