<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title description">
  <title id="title">Bill Viola single-room candidate layout</title>
  <desc id="description">An authored, closed rectangular gameplay shell with the source-observed dresser arrangement placed at the far wall. Room size and unseen boundaries are not recovered from the video.</desc>
