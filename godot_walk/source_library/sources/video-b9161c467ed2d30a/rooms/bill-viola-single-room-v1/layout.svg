  <text x="407" y="185" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#f3e9d7">vase</text>
  <circle cx="348" cy="390" r="12" fill="#bd995e" stroke="#fff0ca" stroke-width="2"/>
  <path d="M348 390 L348 373 M348 390 L348 407" stroke="#fff0ca" stroke-width="2"/>
