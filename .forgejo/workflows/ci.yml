name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - name: Checkout repository
        run: |
          git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - name: Print Rust toolchain
        run: rustc --version && cargo --version

      - name: Build, test, lint
        run: |
          if [ -f "splat_walk/Cargo.toml" ]; then
            cd splat_walk
            cargo fmt --check
            cargo clippy -- -D warnings
            cargo test
            cargo build
          elif [ -f "Cargo.toml" ]; then
            cargo fmt --check
            cargo clippy -- -D warnings
            cargo test
            cargo build
          else
            echo "No Cargo.toml found — skipping Rust CI (project not yet initialized)."
          fi
